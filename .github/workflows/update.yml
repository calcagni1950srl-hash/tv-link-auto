name: Update TV Links

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run robot
        run: python update_links.py

      - name: Commit updated links
        run: |
          git config --global user.name "tv-bot"
          git config --global user.email "bot@github.com"
          git add links.json
          git commit -m "Auto update links" || echo "No changes"
          git push
